apiVersion: v1
kind: Secret
metadata:
  name: {{ include "knowledge-assistant.fullname" . }}-secret
  labels:
    {{- include "knowledge-assistant.labels" . | nindent 4 }}
type: Opaque
stringData:
  OPENAI_API_KEY: {{ required "agent.openaiApiKey is required" .Values.agent.openaiApiKey | quote }}
  DEVUI_AUTH_TOKEN: {{ required "agent.devuiAuthToken is required" .Values.agent.devuiAuthToken | quote }}
  LANGFUSE_PUBLIC_KEY: {{ .Values.agent.langfusePublicKey | quote }}
  LANGFUSE_SECRET_KEY: {{ .Values.agent.langfuseSecretKey | quote }}
  # Shared pgvector credentials for the knowledge MCP server. PGVECTOR_URL (the
  # toolkit's DATABASE_URL) wins over the discrete PG* vars when non-empty.
  PGVECTOR_URL: {{ .Values.pgvector.url | quote }}
  PGPASSWORD: {{ .Values.pgvector.password | quote }}
  {{- if .Values.mcp.brave.enabled }}
  BRAVE_API_KEY: {{ required "mcp.brave.apiKey is required when mcp.brave.enabled is true" .Values.mcp.brave.apiKey | quote }}
  {{- end }}
