{{- if and .Values.httpRoute.enabled .Values.httpRoute.bypassGatewayAuth (.Capabilities.APIVersions.Has "gateway.envoyproxy.io/v1alpha1/SecurityPolicy") }}
# Rendered only when Envoy Gateway's SecurityPolicy CRD is installed (no CRD = no
# gateway-auth policy to bypass).
# Empty route-level SecurityPolicy: overrides the gateway-wide 'gateway-auth'
# policy (LiteLLM key check) for this route only. The DevUI enforces its own
# DEVUI_AUTH_TOKEN bearer token. Same pattern the platform uses for LiteLLM/Langfuse.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ include "knowledge-assistant.fullname" . }}-no-gateway-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "knowledge-assistant.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ include "knowledge-assistant.fullname" . }}
{{- end }}
