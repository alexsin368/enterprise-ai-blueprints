apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "knowledge-assistant.fullname" . }}-config
  labels:
    {{- include "knowledge-assistant.labels" . | nindent 4 }}
data:
  OPENAI_BASE_URL: {{ .Values.agent.openaiBaseUrl | quote }}
  LANGFUSE_HOST: {{ .Values.agent.langfuseHost | quote }}
  LANGFUSE_ENABLE_SENSITIVE_DATA: {{ .Values.agent.langfuseEnableSensitiveData | quote }}
  MODEL_NAME: {{ .Values.agent.modelName | quote }}
  OPENAI_MODEL: {{ .Values.agent.modelName | quote }}
  OPENAI_CHAT_COMPLETION_MODEL: {{ .Values.agent.modelName | quote }}
  KNOWLEDGE_MCP_URL: {{ .Values.agent.knowledgeMcpUrl | quote }}
  BRAVE_MCP_URL: {{ .Values.agent.braveMcpUrl | quote }}
  ENABLE_WEB_SEARCH: {{ .Values.agent.enableWebSearch | quote }}
  ENABLE_MEMORY: {{ .Values.agent.enableMemory | quote }}
  # Shared Redis for conversation memory, without credentials. The password comes
  # from redisPasswordSecret (see the agent container's env).
  REDIS_URL: {{ .Values.redisUrl | quote }}
  # Embedding model + shared pgvector connection for the knowledge MCP server.
  # (PGVECTOR_URL / PGPASSWORD are in the Secret.)
  EMBEDDING_MODEL: {{ .Values.mcp.knowledge.embeddingModel | quote }}
  PGHOST: {{ .Values.pgvector.host | quote }}
  PGPORT: {{ .Values.pgvector.port | quote }}
  PGDATABASE: {{ .Values.pgvector.database | quote }}
  PGUSER: {{ .Values.pgvector.user | quote }}
  AUTO_OPEN_BROWSER: "false"
  PYTHONUNBUFFERED: "1"
  no_proxy: {{ .Values.agent.noProxy | quote }}
  NO_PROXY: {{ .Values.agent.noProxy | quote }}
